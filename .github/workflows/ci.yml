name: CI

on:
  push:
    branches:
      - main
      - codex
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: taskflow
          DB_USERNAME: taskflow
          DB_PASSWORD: taskflow

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Run migrations
        run: php artisan migrate --force --ansi
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: taskflow
          DB_USERNAME: taskflow
          DB_PASSWORD: taskflow

      - name: Lint
        run: composer run lint

      - name: Static analysis
        run: composer run analyse

      - name: Tests with coverage gate
        run: composer run test:coverage:gate

      - name: Copy paste detection
        run: composer run cpd

      - name: Rector dry run
        run: composer run rector

      - name: Dependency audit
        run: composer run deps:audit
